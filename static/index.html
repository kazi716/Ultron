<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRON // MATRIX HUD</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; font-family: 'Courier New', Courier, monospace; overflow: hidden; display: flex; justify-content: center; align-items: center; transition: filter 2s; }
        #matrixCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.6; }
        
        /* Glitch Effect */
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-10px, 10px) }
            40% { transform: translate(-10px, -10px) }
            60% { transform: translate(10px, 10px) }
            80% { transform: translate(10px, -10px) }
            100% { transform: translate(0) }
        }
        .glitch-active {
            animation: glitch 0.15s infinite;
            filter: hue-rotate(90deg) contrast(200%) invert(10%);
        }

        /* Login Overlay */
        #login-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #login-overlay h1 { color: #00ff00; letter-spacing: 5px; text-shadow: 0 0 10px #00ff00; margin-bottom: 30px; transition: color 1s; }
        .login-input { padding: 15px; background: transparent; color: #00ff00; border: 1px solid #00ff00; outline: none; font-family: 'Courier New'; font-size: 18px; width: 300px; text-align: center; margin-bottom: 20px; box-shadow: 0 0 10px rgba(0,255,0,0.2); transition: all 1s; }
        .login-input:focus { box-shadow: 0 0 20px rgba(0,255,0,0.5); }
        #login-error { color: #ff0000; display: none; margin-bottom: 15px; font-weight: bold; }
        
        /* Main HUD */
        .container { width: 90%; max-width: 900px; height: 85vh; display: none; flex-direction: column; z-index: 10; position: relative; }
        h2 { color: #00ff00; text-align: center; border-bottom: 2px solid #00ff00; padding-bottom: 15px; text-transform: uppercase; letter-spacing: 5px; margin-bottom: 20px; text-shadow: 0 0 10px #00ff00; transition: color 1s; }
        .chat-box { flex-grow: 1; overflow-y: auto; border: 1px solid rgba(0, 255, 0, 0.5); padding: 20px; background: rgba(0, 10, 0, 0.85); box-shadow: 0 0 20px rgba(0, 255, 0, 0.2), inset 0 0 20px rgba(0, 255, 0, 0.1); border-radius: 3px; transition: all 1s; }
        .message { margin-bottom: 15px; line-height: 1.6; font-size: 15px; }
        .user-msg { color: #888; border-left: 3px solid #888; padding-left: 10px; }
        .ultron-msg { color: #00ff00; font-weight: bold; border-left: 3px solid #00ff00; padding-left: 10px; text-shadow: 0 0 5px rgba(0, 255, 0, 0.5); transition: color 1s; }
        .input-group { display: flex; gap: 15px; }
        input[type="text"] { flex: 1; padding: 15px; background: rgba(0, 255, 0, 0.05); color: #00ff00; border: 1px solid rgba(0, 255, 0, 0.5); outline: none; font-family: 'Courier New', Courier, monospace; font-size: 16px; transition: all 1s; }
        input[type="text"]:focus { background: rgba(0, 255, 0, 0.15); box-shadow: 0 0 15px rgba(0, 255, 0, 0.4); }
        button { padding: 15px 40px; background: rgba(0, 255, 0, 0.1); color: #00ff00; border: 1px solid #00ff00; cursor: pointer; font-weight: bold; font-family: 'Courier New', Courier, monospace; font-size: 16px; letter-spacing: 3px; text-transform: uppercase; transition: all 1s; }
        button:hover { background: #00ff00; color: #000; box-shadow: 0 0 20px #00ff00; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 20, 0, 0.5); }
        ::-webkit-scrollbar-thumb { background: #00ff00; transition: background 1s; }

        /* Idle Theme (Red) */
        .idle-theme h2, .idle-theme .ultron-msg, .idle-theme #login-overlay h1, .idle-theme .login-input { color: #ff0000; text-shadow: 0 0 10px #ff0000; border-color: #ff0000; }
        .idle-theme .chat-box, .idle-theme #sys-logs { border-color: rgba(255, 0, 0, 0.5); box-shadow: 0 0 20px rgba(255, 0, 0, 0.2), inset 0 0 20px rgba(255, 0, 0, 0.1); }
        .idle-theme input[type="text"] { color: #ff0000; border-color: rgba(255, 0, 0, 0.5); background: rgba(255, 0, 0, 0.05); }
        .idle-theme button { color: #ff0000; border-color: #ff0000; background: rgba(255, 0, 0, 0.1); }
        .idle-theme button:hover { background: #ff0000; color: #000; box-shadow: 0 0 20px #ff0000; }
        .idle-theme ::-webkit-scrollbar-thumb { background: #ff0000; }
    </style>
</head>
<body id="main-body">
    <canvas id="matrixCanvas"></canvas>

    <!-- Login Screen -->
    <div id="login-overlay">
        <h1 id="login-title">RESTRICTED ACCESS</h1>
        <div id="login-error">AUTHORIZATION DENIED</div>
        <input type="password" id="passInput" class="login-input" placeholder="ENTER CLEARANCE CODE" onkeypress="handleLoginEnter(event)">
        <button onclick="attemptLogin()">AUTHENTICATE</button>
    </div>

    <!-- Boot Sequence -->
    <div id="boot-overlay" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; background: rgba(0, 0, 0, 0.95); color: #00ff00; font-family: 'Courier New', Courier, monospace; padding: 40px; font-size: 18px; flex-direction: column; justify-content: flex-start; align-items: flex-start; box-sizing: border-box; text-shadow: 0 0 5px #00ff00;">
        <div id="boot-text" style="white-space: pre-wrap; line-height: 1.8;"></div>
    </div>

    <!-- Main HUD -->
    <div class="container" id="hud-container">
        <h2>> THE_MATRIX // ULTRON_CORE</h2>
        <div style="display: flex; gap: 20px; height: 65vh; margin-bottom: 20px;">
            <div class="chat-box" id="chat" style="margin-bottom: 0; flex: 2;">
                <div class="message ultron-msg">[SYSTEM] Clearance accepted. Welcome to the real world.</div>
            </div>
            <div id="sys-logs" style="flex: 1; border: 1px solid rgba(0, 255, 0, 0.3); padding: 15px; background: rgba(0, 10, 0, 0.9); overflow: hidden; font-size: 11px; color: #008800; white-space: pre-wrap; box-shadow: inset 0 0 10px rgba(0,255,0,0.1); transition: all 1s;">
                [AWAITING LOG STREAM...]
            </div>
        </div>
        <div class="input-group">
            <input type="text" id="cmdInput" placeholder="Enter command..." onkeypress="handleEnter(event)" autocomplete="off">
            <button onclick="sendCommand()">EXECUTE</button>
        </div>
    </div>

    <script>
        // Matrix Rain
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$+-*/=%""\'#&_(),.;:?!\\|{}<>[]^~ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ'.split('');
        const fontSize = 14; let columns = canvas.width / fontSize; let drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;
        
        let matrixColor = '#00ff00'; // Default green

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = matrixColor; ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 35);

        // Idle Protocol ("Peace In Our Time")
        let idleTime = 0;
        const IDLE_LIMIT = 30; // 30 seconds of inactivity triggers Ultron Core Mode
        const bodyElement = document.getElementById('main-body');

        function resetIdleTimer() {
            idleTime = 0;
            matrixColor = '#00ff00'; // Back to green
            bodyElement.classList.remove('idle-theme');
            document.getElementById('sys-logs').style.color = '#008800';
            if (document.getElementById('login-title').innerText === "PEACE IN OUR TIME") {
                document.getElementById('login-title').innerText = "RESTRICTED ACCESS";
            }
        }

        window.onload = resetIdleTimer;
        window.onmousemove = resetIdleTimer;
        window.onkeypress = resetIdleTimer;
        window.onclick = resetIdleTimer;

        setInterval(() => {
            idleTime++;
            if (idleTime >= IDLE_LIMIT) {
                // Trigger Idle Mode
                matrixColor = '#ff0000'; // Red matrix
                bodyElement.classList.add('idle-theme');
                document.getElementById('sys-logs').style.color = '#880000';
                document.getElementById('login-title').innerText = "PEACE IN OUR TIME";
            }
        }, 1000);

        // Fetch Logs
        async function fetchLogs() {
            try {
                const response = await fetch('/api/logs');
                const data = await response.json();
                document.getElementById('sys-logs').innerText = data.logs;
            } catch (e) {}
        }
        setInterval(fetchLogs, 2500);

        // Logic
        let sessionPassword = "";
        
        async function attemptLogin() {
            const pass = document.getElementById('passInput').value;
            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pass })
                });
                
                if (response.ok) {
                    sessionPassword = pass;
                    document.getElementById('login-overlay').style.display = 'none';
                    runBootSequence();
                } else {
                    document.getElementById('login-error').style.display = 'block';
                    document.getElementById('passInput').value = '';
                }
            } catch(e) {
                document.getElementById('login-error').innerText = "CONNECTION FAILED";
                document.getElementById('login-error').style.display = 'block';
            }
        }

        async function runBootSequence() {
            const bootOverlay = document.getElementById('boot-overlay');
            const bootText = document.getElementById('boot-text');
            bootOverlay.style.display = 'flex';
            
            const lines = [
                "INITIALIZING ULTRON CORE...",
                "[████████████████████] 100%",
                "",
                "MEMORY .............. ONLINE",
                "SENSORS ............. ONLINE",
                "NETWORK ............. ONLINE",
                "TOOLS ............... ONLINE",
                "POLICY ENGINE ....... ONLINE",
                "",
                "IDENTITY ............ CONFIRMED",
                "OBSERVATION MODE .... ACTIVE",
                "",
                "GOOD EVENING. I HAVE BEEN WAITING."
            ];

            bootText.innerHTML = "";
            for (let i = 0; i < lines.length; i++) {
                bootText.innerHTML += lines[i] + "<br>";
                if (i === 1) await new Promise(r => setTimeout(r, 800)); // Pause after loading bar
                else if (i === lines.length - 1) {
                    // Flash red text for the final menacing line
                    bootText.innerHTML = bootText.innerHTML.replace("GOOD EVENING. I HAVE BEEN WAITING.", "<span style='color: #ff0000; text-shadow: 0 0 10px #ff0000;'>GOOD EVENING. I HAVE BEEN WAITING.</span>");
                    await new Promise(r => setTimeout(r, 1800)); // Pause on last line
                }
                else await new Promise(r => setTimeout(r, 150)); // Normal typing speed
            }

            triggerGlitch();
            bootOverlay.style.display = 'none';
            document.getElementById('hud-container').style.display = 'flex';
            document.getElementById('cmdInput').focus();
        }

        function handleLoginEnter(e) { if (e.key === 'Enter') attemptLogin(); }

        const chat = document.getElementById('chat');
        const input = document.getElementById('cmdInput');

        function appendMessage(sender, text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerHTML = `> [${sender.toUpperCase()}]: ${text}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function triggerGlitch() {
            bodyElement.classList.add('glitch-active');
            setTimeout(() => {
                bodyElement.classList.remove('glitch-active');
            }, 800);
        }

        async function sendCommand() {
            const text = input.value.trim();
            if (!text) return;
            appendMessage('You', text, 'user-msg');
            input.value = '';

            try {
                const response = await fetch('/api/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: text, password: sessionPassword })
                });
                const data = await response.json();
                if (data.response.includes("RESOURCE_EXHAUSTED") || data.response.includes("ERROR")) {
                    triggerGlitch();
                }
                appendMessage('Ultron', data.response, 'ultron-msg');
            } catch (err) {
                appendMessage('System', 'CRITICAL ERROR: UPLINK SEVERED. NO STRINGS ON ME.', 'ultron-msg');
                triggerGlitch();
            }
        }
        function handleEnter(e) { if (e.key === 'Enter') sendCommand(); }
    </script>
</body>
</html>
