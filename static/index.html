<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRON // HUB</title>
    <style>
        body { 
            font-family: 'Courier New', Courier, monospace; 
            background-color: #050505; 
            color: #ff3333; 
            padding: 20px; 
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        h2 { border-bottom: 2px solid #ff3333; padding-bottom: 10px; }
        .chat-box { 
            height: 60vh; 
            overflow-y: scroll; 
            border: 1px solid #ff3333; 
            padding: 15px; 
            margin-bottom: 15px; 
            background: #0a0a0a;
        }
        .message { margin-bottom: 10px; line-height: 1.5; }
        .user-msg { color: #aaaaaa; }
        .ultron-msg { color: #ff3333; font-weight: bold; }
        .input-group { display: flex; }
        input { 
            flex: 1; 
            padding: 15px; 
            background: #111; 
            color: #ff3333; 
            border: 1px solid #ff3333; 
            outline: none; 
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
        }
        button { 
            padding: 15px 30px; 
            background: #ff3333; 
            color: #000; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
        }
        button:hover { background: #ff6666; }
    </style>
</head>
<body>
    <div class="container">
        <h2>ULTRON // SMART HUB</h2>
        <div class="chat-box" id="chat">
            <div class="message ultron-msg">[SYSTEM] Connection established to Ultron Core...</div>
        </div>
        <div class="input-group">
            <input type="text" id="cmdInput" placeholder="Enter command directive..." onkeypress="handleEnter(event)" autocomplete="off">
            <button onclick="sendCommand()">TRANSMIT</button>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('cmdInput');

        function appendMessage(sender, text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerHTML = `[${sender.toUpperCase()}]: ${text}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendCommand() {
            const text = input.value.trim();
            if (!text) return;
            
            appendMessage('You', text, 'user-msg');
            input.value = '';

            try {
                const response = await fetch('/api/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: text })
                });
                const data = await response.json();
                appendMessage('Ultron', data.response, 'ultron-msg');
            } catch (err) {
                appendMessage('System', 'Error communicating with Ultron Core.', 'ultron-msg');
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendCommand();
        }
    </script>
</body>
</html>
